name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix server

      - name: Build frontend
        env:
          # Until ICP + domain: site is tested by IP. Change to https://www.hbshandao.com later.
          VITE_SITE_URL: http://8.140.28.87
        run: npm run build

      - name: Ensure server prerequisites
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key "${SSH_USER}@${SSH_HOST}" bash -s <<'SETUP'
          set -euo pipefail
          if ! command -v node >/dev/null 2>&1 || [[ "$(node -p "process.versions.node.split('.')[0]")" -lt 22 ]]; then
            echo "Installing Node.js 22..."
            curl -fsSL https://rpm.nodesource.com/setup_22.x | bash -
            dnf install -y nodejs
          fi
          if ! command -v pm2 >/dev/null 2>&1; then
            echo "Installing PM2..."
            npm install -g pm2
            pm2 startup systemd -u root --hp /root | tail -1 | bash || true
          fi
          mkdir -p /var/www/hbshandao/server/data
          node -v
          pm2 -v
          SETUP

      - name: Deploy to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key "${SSH_USER}@${SSH_HOST}" 'mkdir -p /var/www/hbshandao/server/data && rm -rf /var/www/hbshandao/dist'

          tar -czf - \
            --exclude='server/node_modules' \
            --exclude='server/.env' \
            --exclude='server/data' \
            dist server \
            | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "${SSH_USER}@${SSH_HOST}" \
              'tar -xzf - -C /var/www/hbshandao'

          ssh -i ~/.ssh/deploy_key "${SSH_USER}@${SSH_HOST}" env ADMIN_PASSWORD="$ADMIN_PASSWORD" bash -s <<'REMOTE'
          set -euo pipefail
          cd /var/www/hbshandao/server
          mkdir -p data
          printf 'PORT=3001\nADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD" > .env
          npm ci --omit=dev
          if pm2 describe hbshandao-api >/dev/null 2>&1; then
            pm2 restart hbshandao-api
          else
            pm2 start index.js --name hbshandao-api --cwd /var/www/hbshandao/server
          fi
          pm2 save
          REMOTE
