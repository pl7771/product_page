name: Deploy

on:
  push:
    branches: [main]
  # Nightly rebuild so articles published from the admin panel get a
  # prerendered page and a sitemap entry (crawlers like Baiduspider don't run
  # JS). 19:17 UTC = 03:17 Beijing; off the hour because GitHub delays
  # top-of-hour schedules. Visitors see new articles immediately regardless.
  schedule:
    - cron: '17 19 * * *'
  # "Run workflow" button in the Actions tab for an on-demand rebuild.
  workflow_dispatch:
  # Fired by the API server (debounced) right after an article is published or
  # changed in the admin panel, so the new page is prerendered and added to the
  # sitemap within minutes instead of waiting for the nightly cron. These calls
  # also count as repository activity, which keeps the schedule above from being
  # disabled after 60 days of inactivity.
  repository_dispatch:
    types: [article-change]

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix server

      - name: Install Chrome system libraries (for prerender)
        # Puppeteer downloads its own Chrome during `npm ci`; these are the shared
        # libraries it needs to launch headless. Non-fatal: prerender falls back to
        # the plain SPA if the browser can't start, so a miss here never breaks deploy.
        run: |
          sudo apt-get update || true
          sudo apt-get install -y \
            libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libasound2t64 libpango-1.0-0 libcairo2 fonts-liberation \
            || sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libasound2 libpango-1.0-0 libcairo2 fonts-liberation \
            || true

      - name: Build frontend
        env:
          # ICP filing complete (冀ICP备2026024129号-1), HTTPS live on the domain.
          VITE_SITE_URL: https://www.hbshandao.com
        run: npm run build

      - name: Ensure server prerequisites
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key "${SSH_USER}@${SSH_HOST}" bash -s <<'SETUP'
          set -euo pipefail
          if ! command -v node >/dev/null 2>&1 || [[ "$(node -p "process.versions.node.split('.')[0]")" -lt 22 ]]; then
            echo "Installing Node.js 22..."
            curl -fsSL https://rpm.nodesource.com/setup_22.x | bash -
            dnf install -y nodejs
          fi
          if ! command -v pm2 >/dev/null 2>&1; then
            echo "Installing PM2..."
            npm install -g pm2
            pm2 startup systemd -u root --hp /root | tail -1 | bash || true
          fi
          mkdir -p /var/www/hbshandao/server/data
          node -v
          pm2 -v
          SETUP

      - name: Deploy to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # Unpack into a staging dir first; dist is swapped into place with a
          # single rename below, so nginx never serves a half-extracted tree.
          ssh -i ~/.ssh/deploy_key "${SSH_USER}@${SSH_HOST}" \
            'rm -rf /var/www/hbshandao/.stage && mkdir -p /var/www/hbshandao/.stage /var/www/hbshandao/server/data'

          tar -czf - \
            --exclude='server/node_modules' \
            --exclude='server/.env' \
            --exclude='server/data' \
            dist server \
            | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "${SSH_USER}@${SSH_HOST}" \
              'tar -xzf - -C /var/www/hbshandao/.stage'

          ssh -i ~/.ssh/deploy_key "${SSH_USER}@${SSH_HOST}" env ADMIN_PASSWORD="$ADMIN_PASSWORD" bash -s <<'REMOTE'
          set -euo pipefail
          cd /var/www/hbshandao

          # --- Atomic swap of the static site (dist) ---------------------------
          # Everything was unpacked under .stage first, so the only moment nginx
          # could miss files is the rename below (one syscall), not the whole
          # extraction. The previous tree is kept as dist.old until the new one is
          # in place, then removed.
          rm -rf dist.old
          if [ -d dist ]; then mv dist dist.old; fi
          mv .stage/dist dist

          # Server code: overlay in place. node_modules/.env/data were excluded
          # from the tarball, so they are preserved.
          mkdir -p server/data
          cp -a .stage/server/. server/
          rm -rf .stage dist.old

          # --- Permissions -----------------------------------------------------
          NGINX_USER="$(awk '/^user / { print $2; exit }' /etc/nginx/nginx.conf | tr -d ';')"
          if [[ -n "$NGINX_USER" ]] && id "$NGINX_USER" >/dev/null 2>&1; then
            chown -R "$NGINX_USER:$NGINX_USER" /var/www/hbshandao/dist
          fi
          chmod 755 /var/www
          chmod 755 /var/www/hbshandao
          chmod -R a+rX /var/www/hbshandao/dist

          # --- API restart -----------------------------------------------------
          cd /var/www/hbshandao/server
          mkdir -p data
          # Rewrite .env but preserve any manually-set keys (e.g. the deploy-trigger
          # token), which live only on the server and must survive each deploy.
          PRESERVED="$( [ -f .env ] && grep -E '^(GITHUB_DISPATCH_TOKEN|GITHUB_DISPATCH_REPO|DEPLOY_TRIGGER_DEBOUNCE_MS)=' .env || true )"
          {
            printf 'PORT=3001\n'
            printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD"
            [ -n "$PRESERVED" ] && printf '%s\n' "$PRESERVED"
          } > .env.new
          mv .env.new .env
          npm ci --omit=dev
          if pm2 describe hbshandao-api >/dev/null 2>&1; then
            pm2 restart hbshandao-api
          else
            pm2 start index.js --name hbshandao-api --cwd /var/www/hbshandao/server
          fi
          pm2 save
          REMOTE
