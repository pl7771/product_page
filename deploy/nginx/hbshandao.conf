# Production nginx config for hbshandao.com (Alibaba Cloud Linux 3).
# Lives on the server at /etc/nginx/conf.d/hbshandao.conf — keep this file in
# sync by hand; the deploy workflow ships dist/ + server/ only, not this config.
#
# Apply:  cp deploy/nginx/hbshandao.conf /etc/nginx/conf.d/ && nginx -t && systemctl reload nginx

# HTTP: redirect the domain to HTTPS, keep serving by bare IP.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/hbshandao/dist;

    location / {
        if ($host ~ ^(www\.)?hbshandao\.com$) {
            return 301 https://www.hbshandao.com$request_uri;
        }
        try_files $uri $uri/index.html $uri/ /index.html;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /data/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}

# HTTPS: bare domain -> www, so search engines see one canonical host.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hbshandao.com;

    ssl_certificate     /etc/nginx/ssl/www.hbshandao.com.pem;
    ssl_certificate_key /etc/nginx/ssl/www.hbshandao.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://www.hbshandao.com$request_uri;
}

# HTTPS: the site.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.hbshandao.com;

    ssl_certificate     /etc/nginx/ssl/www.hbshandao.com.pem;
    ssl_certificate_key /etc/nginx/ssl/www.hbshandao.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/hbshandao/dist;
    index index.html;

    client_max_body_size 12m;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /data/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Missing static files must answer 404 instead of falling through to the SPA
    # shell: /favicon.ico used to return the 83 KB home page with status 200.
    location ~* \.(?:ico|png|jpe?g|gif|svg|webp|avif|css|js|mjs|map|json|txt|xml|gz|woff2?|ttf|otf|eot|mp4|webm|pdf|zip)$ {
        try_files $uri =404;
        access_log off;
    }

    # $uri/index.html before $uri/ serves the prerendered page directly: without
    # it nginx 301s /solutions to /solutions/, while canonical tags, internal
    # links and the sitemap all use the slash-less form.
    # The final /index.html keeps articles published from the admin panel
    # working — they exist only client-side until the next build.
    location / {
        try_files $uri $uri/index.html $uri/ /index.html;
    }
}
